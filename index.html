<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Televendas Fast</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <!-- jsPDF para Geração de PDFs -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <!-- PDF.js para Leitura e Extração de Texto de PDFs -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <style>
    :root {
      --bg-page: #f8fafc;
      --surface: #ffffff;
      --surface-subtle: #f1f5f9;
      --border: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #ea580c;
      --primary-hover: #c2410c;
      --primary-light: #fff7ed;
      --danger: #dc2626;
      --danger-light: #fef2f2;
      --warning: #d97706;
      --warning-light: #fffbeb;
      --success: #16a34a;
      --success-light: #f0fdf4;
      --radius: 14px;
      --safe-bottom: env(safe-area-inset-bottom, 16px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .app-viewport {
      width: 100%;
      max-width: 440px;
      background: var(--surface);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 25px rgba(0,0,0,0.04);
      position: relative;
    }

    header {
      padding: 16px 20px 12px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .brand-title {
      font-size: 19px;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand-title span {
      color: var(--primary);
    }

    .btn-new-order {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 99px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Linha do Botão Importar Pedido */
    .import-row {
      margin-bottom: 10px;
    }

    .btn-import-order {
      width: 100%;
      background: var(--primary-light);
      border: 1px dashed var(--primary);
      color: var(--primary);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .search-filter-row {
      display: flex;
      gap: 8px;
      position: relative;
    }

    .search-box {
      flex: 1;
      position: relative;
    }

    .search-input {
      width: 100%;
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 12px 9px 34px;
      font-size: 14px;
      color: var(--text-main);
      outline: none;
    }

    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
      color: var(--text-muted);
    }

    .btn-filter-trigger {
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      color: var(--text-main);
      border-radius: 10px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .filter-dropdown {
      display: none;
      position: absolute;
      right: 0;
      top: calc(100% + 6px);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      width: 220px;
      z-index: 30;
      padding: 6px;
    }

    .filter-dropdown.active {
      display: block;
    }

    .filter-item {
      padding: 9px 12px;
      font-size: 13px;
      color: var(--text-main);
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .filter-item:hover, .filter-item.active {
      background: var(--surface-subtle);
      font-weight: 600;
      color: var(--primary);
    }

    main {
      flex: 1;
      padding: 16px 20px calc(var(--safe-bottom) + 32px);
      overflow-y: auto;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      font-size: 14px;
    }

    .order-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
      cursor: pointer;
      transition: border-color 0.15s ease;
    }

    .order-card:active {
      border-color: var(--primary);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 10px;
    }

    .card-client {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
    }

    .card-date {
      font-size: 12px;
      color: var(--text-muted);
    }

    .card-timeline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 12px 0;
      position: relative;
    }

    .card-timeline::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 12px;
      right: 12px;
      height: 2px;
      background: var(--border);
      z-index: 1;
      transform: translateY(-50%);
    }

    .tl-step {
      position: relative;
      z-index: 2;
      background: var(--surface);
      padding: 0 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .tl-node {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--surface-subtle);
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
    }

    .tl-step.completed .tl-node {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .tl-step.current .tl-node {
      background: #fff;
      border-color: var(--primary);
      color: var(--primary);
    }

    .tl-label {
      font-size: 10px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      margin-top: 6px;
      width: 100%;
    }

    .status-badge.danger {
      background: var(--danger-light);
      color: var(--danger);
    }

    .status-badge.warning {
      background: var(--warning-light);
      color: var(--warning);
    }

    .status-badge.success {
      background: var(--success-light);
      color: var(--success);
    }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.4);
      z-index: 100;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-sheet {
      background: var(--surface);
      width: 100%;
      max-width: 440px;
      max-height: 92vh;
      border-radius: 20px 20px 0 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: slideUp 0.2s cubic-bezier(0, 0, 0.2, 1);
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .sheet-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sheet-title {
      font-size: 16px;
      font-weight: 700;
    }

    .sheet-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-download-pdf-order {
      background: var(--primary-light);
      color: var(--primary);
      border: 1px solid var(--primary);
      font-size: 12px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn-close-sheet {
      background: none;
      border: none;
      font-size: 20px;
      color: var(--text-muted);
      cursor: pointer;
    }

    .sheet-body {
      padding: 16px 20px;
      overflow-y: auto;
      flex: 1;
    }

    .sheet-footer {
      padding: 12px 20px calc(var(--safe-bottom) + 12px);
      border-top: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      gap: 10px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input, select {
      width: 100%;
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      color: var(--text-main);
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--primary);
    }

    .form-row {
      display: flex;
      gap: 10px;
    }

    .btn-submit {
      flex: 1;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }

    .btn-secondary {
      background: var(--surface-subtle);
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }

    .btn-delete {
      background: var(--danger-light);
      color: var(--danger);
      border: none;
      border-radius: 10px;
      padding: 12px 16px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }

    .item-card-edit {
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
      position: relative;
    }

    .btn-remove-item {
      position: absolute;
      top: 8px;
      right: 8px;
      background: none;
      border: none;
      color: var(--danger);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .pallet-box {
      background: var(--surface-subtle);
      border: 1px dashed var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-top: 12px;
    }

    .pallet-tag {
      background: #fff;
      border: 1px solid var(--border);
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 6px;
      gap: 8px;
    }

    .pallet-tag-info {
      flex: 1;
    }

    .pallet-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-pdf-mini {
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 6px;
      font-size: 11px;
      font-weight: 600;
      color: var(--primary);
      cursor: pointer;
    }

    .btn-del-tag {
      background: none;
      border: none;
      color: var(--danger);
      font-size: 14px;
      cursor: pointer;
      padding: 2px 6px;
    }
  </style>
</head>
<body>

  <div class="app-viewport">
    <header>
      <div class="header-top">
        <div class="brand-title">Televendas <span>Fast</span></div>
        <button class="btn-new-order" id="btnOpenNewOrder">+ Novo</button>
      </div>

      <!-- Botão Importar Pedido Padronizado -->
      <div class="import-row">
        <input type="file" id="fileImportInput" accept="application/pdf,image/png,image/jpeg" style="display: none;">
        <button type="button" class="btn-import-order" id="btnTriggerImport">
          📥 Importar Pedido (PDF / Imagem)
        </button>
      </div>
      
      <div class="search-filter-row">
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input type="text" id="searchInput" class="search-input" placeholder="Buscar cliente ou produto...">
        </div>
        
        <button class="btn-filter-trigger" id="btnFilterTrigger">
          <span>Filtro</span> ▼
        </button>

        <div class="filter-dropdown" id="filterDropdown">
          <div class="filter-item active" data-filter="all">Todos os Pedidos</div>
          <div class="filter-item" data-filter="step1">1. Em Andamento</div>
          <div class="filter-item" data-filter="step2">2. Para Separar</div>
          <div class="filter-item" data-filter="deficit">Falta Quantidade</div>
          <div class="filter-item" data-filter="excess">Qtd Excessiva</div>
          <div class="filter-item" data-filter="step3">3. Aprovados / Liberados</div>
        </div>
      </div>
    </header>

    <main id="ordersList">
      <div class="empty-state">Nenhum pedido registrado. Toque em "+ Novo" ou importe um arquivo.</div>
    </main>
  </div>

  <!-- Modal / Gerenciador Unificado de Pedido -->
  <div class="modal-overlay" id="orderModal">
    <div class="modal-sheet">
      <div class="sheet-header">
        <div class="sheet-title" id="modalTitle">Pedido</div>
        <div class="sheet-actions">
          <button type="button" class="btn-download-pdf-order" id="btnDownloadOrderPdf" style="display: none;" title="Baixar PDF Geral">📄 Baixar Pedido</button>
          <button class="btn-close-sheet" id="btnCloseModal">✕</button>
        </div>
      </div>

      <div style="padding: 12px 20px; border-bottom: 1px solid var(--border); background: var(--surface-subtle);">
        <div class="card-timeline" id="modalTimeline">
          <div class="tl-step" id="stepNode1" style="cursor: pointer;">
            <div class="tl-node">1</div>
            <div class="tl-label">Registro</div>
          </div>
          <div class="tl-step" id="stepNode2" style="cursor: pointer;">
            <div class="tl-node">2</div>
            <div class="tl-label">Separação</div>
          </div>
          <div class="tl-step" id="stepNode3" style="cursor: pointer;">
            <div class="tl-node">3</div>
            <div class="tl-label">Conferência</div>
          </div>
        </div>
      </div>

      <div class="sheet-body">
        
        <!-- ETAPA 1 -->
        <div id="viewStep1">
          <div class="form-group">
            <label>Cliente</label>
            <input type="text" id="orderClient" placeholder="Nome do cliente ou razão social">
          </div>
          <div class="form-group">
            <label>Dia a ser retirado</label>
            <input type="date" id="orderDate">
          </div>

          <div style="margin: 20px 0 10px; display: flex; justify-content: space-between; align-items: center;">
            <label style="margin:0;">Produtos Solicitados</label>
            <button type="button" id="btnAddProductRow" style="background: none; border: none; color: var(--primary); font-size: 13px; font-weight: 600; cursor: pointer;">+ Adicionar Produto</button>
          </div>

          <div id="productsContainer"></div>
        </div>

        <!-- ETAPA 2 -->
        <div id="viewStep2" style="display: none;">
          <div id="separationItemsList"></div>

          <div class="pallet-box" id="palletBoxForm" style="display: none;">
            <div style="font-size: 13px; font-weight: 700; margin-bottom: 8px;" id="palletTargetItemName">Adicionar Palete</div>
            
            <div class="form-group">
              <label>Posição na Prateleira</label>
              <select id="palShelf">
                <option value="" disabled selected>Selecione a posição</option>
                <option value="Caixaria">Caixaria</option>
                <option value="Pega">Pega</option>
                <option value="Gaveta">Gaveta</option>
                <option value="Sub-aéreo">Sub-aéreo</option>
                <option value="Aéreo">Aéreo</option>
                <option value="Palete">Palete</option>
                <option value="Prancha">Prancha</option>
              </select>
            </div>

            <div class="form-group">
              <label>Localização</label>
              <select id="palLocation">
                <option value="" disabled selected>Selecione a localização</option>
                <option value="Corredor 1">Corredor 1</option>
                <option value="Corredor 2">Corredor 2</option>
                <option value="Corredor 3">Corredor 3</option>
                <option value="Corredor 4">Corredor 4</option>
                <option value="Corredor 5">Corredor 5</option>
                <option value="Corredor 6">Corredor 6</option>
                <option value="Corredor 7">Corredor 7</option>
                <option value="Corredor 8">Corredor 8</option>
                <option value="Corredor 9">Corredor 9</option>
                <option value="Corredor 10">Corredor 10</option>
                <option value="Corredor 11">Corredor 11</option>
                <option value="Corredor 12">Corredor 12</option>
                <option value="Corredor 13">Corredor 13</option>
                <option value="Corredor 14">Corredor 14</option>
                <option value="Corredor 15">Corredor 15</option>
                <option value="Depósito">Depósito</option>
                <option value="Doca">Doca</option>
                <option value="Televendas">Televendas</option>
                <option value="Alto Giro">Alto Giro</option>
                <option value="Extremidade Superior Loja">Extremidade Superior Loja</option>
                <option value="Extremidade Inferior Loja">Extremidade Inferior Loja</option>
              </select>
            </div>

            <div class="form-group" id="groupExtraCondition" style="display: none;">
              <label id="labelExtraCondition">Condição</label>
              <select id="palExtraCondition">
                <option value="" disabled selected>Selecione a condição</option>
              </select>
            </div>

            <div class="form-group">
              <label>Quantidade Separada</label>
              <input type="number" id="palQty" placeholder="Digite a quantidade...">
            </div>

            <div style="display: flex; gap: 8px;">
              <button type="button" class="btn-submit" id="btnConfirmAddPallet">Confirmar Palete</button>
              <button type="button" class="btn-secondary" id="btnCancelPallet">Cancelar</button>
            </div>
          </div>
        </div>

        <!-- ETAPA 3 -->
        <div id="viewStep3" style="display: none;">
          <div style="font-size: 14px; font-weight: 700; margin-bottom: 12px;">Resumo da Auditoria</div>
          <div id="auditStatusResult"></div>
          <div id="auditItemsBreakdown" style="margin-top: 14px;"></div>
        </div>

      </div>

      <div class="sheet-footer">
        <button type="button" class="btn-delete" id="btnDeleteCurrentOrder" style="display: none;">Excluir</button>
        <button type="button" class="btn-secondary" id="btnFooterPrev">Voltar</button>
        <button type="button" class="btn-submit" id="btnFooterNext">Avançar</button>
      </div>
    </div>
  </div>

  <script>
    const StorageKey = "televendas_fast_orders";
    let orders = JSON.parse(localStorage.getItem(StorageKey) || "[]");
    let activeFilter = "all";
    let currentEditingOrderId = null;
    let currentStep = 1;
    let selectedItemIndexForPallet = null;

    const ordersList = document.getElementById("ordersList");
    const searchInput = document.getElementById("searchInput");
    const btnFilterTrigger = document.getElementById("btnFilterTrigger");
    const filterDropdown = document.getElementById("filterDropdown");
    const orderModal = document.getElementById("orderModal");
    const btnOpenNewOrder = document.getElementById("btnOpenNewOrder");
    const btnCloseModal = document.getElementById("btnCloseModal");
    const btnDownloadOrderPdf = document.getElementById("btnDownloadOrderPdf");

    // Inputs de Importação
    const btnTriggerImport = document.getElementById("btnTriggerImport");
    const fileImportInput = document.getElementById("fileImportInput");

    // Configuração do Worker do PDF.js
    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }

    // ==========================================
    // MÓDULO DE IMPORTAÇÃO E VALIDAÇÃO DE DOCUMENTO
    // ==========================================
    btnTriggerImport.addEventListener("click", () => {
      fileImportInput.value = "";
      fileImportInput.click();
    });

    fileImportInput.addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      btnTriggerImport.textContent = "⏳ Analisando documento...";
      btnTriggerImport.disabled = true;

      try {
        if (file.type === "application/pdf" || file.name.endsWith(".pdf")) {
          await processPdfImport(file);
        } else {
          alert("Para garantir a conferência exata dos dados sem erros de leitura no smartphone, envie o arquivo .PDF original gerado pelo aplicativo.");
        }
      } catch (err) {
        alert("Erro ao processar o arquivo: " + err.message);
      } finally {
        btnTriggerImport.textContent = "📥 Importar Pedido (PDF / Imagem)";
        btnTriggerImport.disabled = false;
      }
    });

    async function processPdfImport(file) {
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      let fullText = "";

      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const textContent = await page.getTextContent();
        const pageText = textContent.items.map(item => item.str).join(" ");
        fullText += pageText + "\n";
      }

      // Validação de Integridade: termos obrigatórios do cabeçalho
      if (!fullText.includes("TELEVENDAS FAST") || !fullText.includes("RELATÓRIO DO PEDIDO")) {
        alert("Documento Inválido! O arquivo selecionado não é um pedido oficial do Televendas Fast.");
        return;
      }

      // Extração de Cliente
      let client = "Cliente Importado";
      const clientMatch = fullText.match(/Cliente:\s*(.*?)(?=\s*Data de Retirada:|$)/i);
      if (clientMatch && clientMatch[1]) {
        client = clientMatch[1].trim();
      }

      // Extração de Data
      let pickupDate = "";
      const dateMatch = fullText.match(/Data de Retirada:\s*(\d{2})\/(\d{2})\/(\d{4})/i);
      if (dateMatch) {
        pickupDate = `${dateMatch[3]}-${dateMatch[2]}-${dateMatch[1]}`;
      }

      // Extração dos Itens e Quantidades
      // Padrão gerado: "1. Arroz (Tipo 1) Solicitado: 10 Fardo(s)"
      const items = [];
      const itemRegex = /\d+\.\s+([^(]+?)(?:\s*\((.*?)\))?\s+Solicitado:\s*(\d+)\s*(Fardo|Unidade)/gi;
      let match;

      while ((match = itemRegex.exec(fullText)) !== null) {
        items.push({
          name: match[1].trim(),
          variation: match[2] ? match[2].trim() : "",
          quantity: Number(match[3]),
          packageType: match[4] === "Unidade" ? "Unidade" : "Fardo",
          pallets: [] // Começa pendente para a Etapa 2 de separação
        });
      }

      if (items.length === 0) {
        // Fallback para itens sem variação ou layout ligeiramente condensado
        const simpleRegex = /\d+\.\s+(.+?)\s+Solicitado:\s*(\d+)\s*(Fardo|Unidade)/gi;
        while ((match = simpleRegex.exec(fullText)) !== null) {
          items.push({
            name: match[1].trim(),
            variation: "",
            quantity: Number(match[2]),
            packageType: match[3] === "Unidade" ? "Unidade" : "Fardo",
            pallets: []
          });
        }
      }

      if (items.length === 0) {
        alert("Documento Inválido: Não foi possível identificar a lista de produtos deste pedido.");
        return;
      }

      // Criação do Pedido na Memória e Armazenamento
      const newOrder = {
        id: "ord_" + Date.now(),
        client,
        pickupDate,
        items,
        currentStep: 1 // Inicia na Etapa 1 pendente para a separação
      };

      orders.unshift(newOrder);
      localStorage.setItem(StorageKey, JSON.stringify(orders));
      renderOrders();

      alert(`Pedido de "${client}" importado com sucesso! Ele está disponível na tela inicial para iniciar a separação.`);
    }

    // Filtros

    searchInput.addEventListener("input", renderOrders);

    function auditOrder(order) {
      let deficitCount = 0;
      let excessCount = 0;
      let details = [];

      order.items.forEach(it => {
        const required = Number(it.quantity) || 0;
        const pallets = it.pallets || [];
        const allocated = pallets.reduce((sum, p) => sum + (Number(p.quantity) || 0), 0);
        const diff = allocated - required;

        if (diff < 0) {
          deficitCount += Math.abs(diff);
          details.push({ item: it.name, type: "deficit", count: Math.abs(diff), unit: it.packageType });
        } else if (diff > 0) {
          excessCount += diff;
          details.push({ item: it.name, type: "excess", count: diff, unit: it.packageType });
        }
      });

      return { deficitCount, excessCount, details, isApproved: deficitCount === 0 && excessCount === 0 };
    }

    function renderOrders() {
      const q = searchInput.value.toLowerCase().trim();
      ordersList.innerHTML = "";

      const filtered = orders.filter(ord => {
        const matchSearch = ord.client.toLowerCase().includes(q) || 
          ord.items.some(i => i.name.toLowerCase().includes(q));

        if (!matchSearch) return false;

        const audit = auditOrder(ord);
        if (activeFilter === "step1") return ord.currentStep === 1;
        if (activeFilter === "step2") return ord.currentStep === 2;
        if (activeFilter === "step3") return ord.currentStep === 3 && audit.isApproved;
        if (activeFilter === "deficit") return audit.deficitCount > 0;
        if (activeFilter === "excess") return audit.excessCount > 0;
        return true;
      });

      if (filtered.length === 0) {
        ordersList.innerHTML = '<div class="empty-state">Nenhum pedido encontrado.</div>';
        return;
      }

      filtered.forEach(ord => {
        const audit = auditOrder(ord);
        const card = document.createElement("div");
        card.className = "order-card";
        
        let statusBadgeHtml = "";
        if (audit.deficitCount > 0) {
          statusBadgeHtml = `<div class="status-badge danger">⚠️ Faltam ${audit.deficitCount} volume(s) para completar</div>`;
        } else if (audit.excessCount > 0) {
          statusBadgeHtml = `<div class="status-badge warning">⚠️ Quantidade excessiva (+${audit.excessCount})</div>`;
        } else {
          statusBadgeHtml = `<div class="status-badge success">✓ Pedido aprovado e liberado</div>`;
        }

        card.innerHTML = `
          <div class="card-top">
            <div class="card-client">${ord.client || "Sem Nome"}</div>
            <div class="card-date">Retirada: ${ord.pickupDate ? ord.pickupDate.split("-").reverse().join("/") : "--/--/----"}</div>
          </div>
          <div class="card-timeline">
            <div class="tl-step ${ord.currentStep >= 1 ? (ord.currentStep > 1 ? 'completed' : 'current') : ''}">
              <div class="tl-node">1</div>
              <div class="tl-label">Andamento</div>
            </div>
            <div class="tl-step ${ord.currentStep >= 2 ? (ord.currentStep > 2 ? 'completed' : 'current') : ''}">
              <div class="tl-node">2</div>
              <div class="tl-label">Separação</div>
            </div>
            <div class="tl-step ${ord.currentStep === 3 ? 'completed' : ''}">
              <div class="tl-node">3</div>
              <div class="tl-label">Conferido</div>
            </div>
          </div>
          ${statusBadgeHtml}
        `;

        card.addEventListener("click", () => openOrder(ord.id, ord.currentStep));
        ordersList.appendChild(card);
      });
    }

    function openOrder(id = null, forceStep = 1) {

      } else {
        document.getElementById("modalTitle").textContent = "Novo Pedido";
        document.getElementById("orderClient").value = "";
        document.getElementById("orderDate").value = "";
        renderProductRows([{ name: "", variation: "", packageType: "Fardo", quantity: "" }]);

      setStep(currentStep);
      orderModal.classList.add("active");

    function setStep(step) {
      currentStep = step;
      
      document.getElementById("viewStep1").style.display = step === 1 ? "block" : "none";
      document.getElementById("viewStep2").style.display = step === 2 ? "block" : "none";
      document.getElementById("viewStep3").style.display = step === 3 ? "block" : "none";

      [1, 2, 3].forEach(s => {
        const node = document.getElementById("stepNode" + s);
        node.className = "tl-step " + (step === s ? "current" : (step > s ? "completed" : ""));
      });

      document.getElementById("btnFooterPrev").textContent = step === 1 ? "Cancelar" : "Voltar";
      document.getElementById("btnFooterNext").textContent = step === 3 ? "Concluir" : "Avançar";

      if (step === 2) renderSeparationStep();
      if (step === 3) renderAuditStep();

    function saveCurrentStateInMemory() {
      const client = document.getElementById("orderClient").value;
      const pickupDate = document.getElementById("orderDate").value;
      
      const cards = productsContainer.querySelectorAll(".item-card-edit");
      const items = [];
      cards.forEach((card, idx) => {
        const name = card.querySelector(".inp-prod-name").value;
        const variation = card.querySelector(".inp-prod-var").value;
        const packageType = card.querySelector(".inp-prod-pkg").value;
        const quantity = card.querySelector(".inp-prod-qty").value;
        
        let existingPallets = [];
        if (currentEditingOrderId) {
          const orig = orders.find(o => o.id === currentEditingOrderId);
          if (orig && orig.items[idx]) existingPallets = orig.items[idx].pallets || [];
        }

        items.push({ name, variation, packageType, quantity, pallets: existingPallets });
      });

      if (!currentEditingOrderId) {
        currentEditingOrderId = "ord_" + Date.now();
        orders.unshift({ id: currentEditingOrderId, client, pickupDate, items, currentStep });
      } else {
        const ord = orders.find(o => o.id === currentEditingOrderId);
        if (ord) {
          ord.client = client;
          ord.pickupDate = pickupDate;
          ord.items = items;
          ord.currentStep = currentStep;
        }
      }
      localStorage.setItem(StorageKey, JSON.stringify(orders));
    }

    function getCurrentOrderObject() {
      return orders.find(o => o.id === currentEditingOrderId);
    }

    const palExtraCondition = document.getElementById("palExtraCondition");

      palExtraCondition.innerHTML = '<option value="" disabled selected>Selecione a condição</option>';

      if (val.startsWith("Corredor")) {
        groupExtraCondition.style.display = "block";
        palExtraCondition.innerHTML += `
          <option value="Superior">Superior</option>
          <option value="Inferior">Inferior</option>
        `;
      } else if (val === "Depósito") {
        groupExtraCondition.style.display = "block";
        const setores = ["Líquida", "Seca Salgada", "Seca Doce", "Perfumaria", "DPH", "Bazar"];
        setores.forEach(s => {
          palExtraCondition.innerHTML += `<option value="${s}">${s}</option>`;

      } else {

          ${diff < 0 ? `<div style="color: var(--danger); font-size: 11px; font-weight:600;">Faltam ${Math.abs(diff)} ${item.packageType}(s)</div>` : ''}
          ${diff > 0 ? `<div style="color: var(--warning); font-size: 11px; font-weight:600;">Excesso de ${diff} ${item.packageType}(s)</div>` : ''}

          <div style="margin-top: 8px;">
            ${pallets.map((p, pIdx) => `

      const item = ord.items[itemIdx];

      document.getElementById("palletTargetItemName").textContent = `Alocar: ${item.name} (${item.packageType})`;

      document.getElementById("palLocation").selectedIndex = 0;
      document.getElementById("palQty").value = "";
      groupExtraCondition.style.display = "none";

      const box = document.getElementById("palletBoxForm");
      box.style.display = "block";
      box.scrollIntoView({ behavior: 'smooth' });

    });

    document.getElementById("btnConfirmAddPallet").addEventListener("click", () => {
      const shelf = document.getElementById("palShelf").value;
      const location = document.getElementById("palLocation").value;
      const extra = palExtraCondition.value;
      const qty = document.getElementById("palQty").value;

      if (!shelf || !location || !qty || Number(qty) <= 0) {
        alert("Preencha todos os campos do palete com valores válidos.");
        return;
      }

      if (groupExtraCondition.style.display !== "none" && !extra) {
        alert("Selecione a condição correspondente (superior/inferior ou setor).");
        return;
      }

      const ord = getCurrentOrderObject();
      if (!ord.items[selectedItemIndexForPallet].pallets) {
        ord.items[selectedItemIndexForPallet].pallets = [];
      }

      ord.items[selectedItemIndexForPallet].pallets.push({
        shelf,
        location,
        extra: groupExtraCondition.style.display !== "none" ? extra : null,
        quantity: Number(qty)
      });

      localStorage.setItem(StorageKey, JSON.stringify(orders));
      document.getElementById("palletBoxForm").style.display = "none";
      renderSeparationStep();
    });

    window.removePallet = function(itemIdx, palletIdx) {
      const ord = getCurrentOrderObject();
      ord.items[itemIdx].pallets.splice(palletIdx, 1);
      localStorage.setItem(StorageKey, JSON.stringify(orders));
      renderSeparationStep();

    function renderAuditStep() {
      const ord = getCurrentOrderObject();
      const audit = auditOrder(ord);

      const statusBox = document.getElementById("auditStatusResult");
      const breakdownBox = document.getElementById("auditItemsBreakdown");

      if (audit.isApproved) {

            ✓ Pedido Concluído: Quantidades 100% conferidas e liberadas.

          </div>

      breakdownBox.innerHTML = audit.details.map(d => `

        localStorage.setItem(StorageKey, JSON.stringify(orders));

      ord.items.forEach((it, i) => {
        if (currentY > 260) {
          doc.addPage();
          currentY = 20;
        }

        const allocated = (it.pallets || []).reduce((sum, p) => sum + (Number(p.quantity) || 0), 0);
        
        doc.setFillColor(241, 245, 249);
        doc.rect(14, currentY, 182, 8, "F");
        doc.setFontSize(10);
        doc.setFont("helvetica", "bold");
        doc.setTextColor(15, 23, 42);
        doc.text(`${i + 1}. ${it.name} ${it.variation ? `(${it.variation})` : ''}`, 16, currentY + 5.5);
        doc.text(`Solicitado: ${it.quantity} ${it.packageType}(s) | Alocado: ${allocated}`, 194, currentY + 5.5, { align: "right" });
        currentY += 12;

        if (!it.pallets || it.pallets.length === 0) {
          doc.setFontSize(9);
          doc.setFont("helvetica", "italic");
          doc.setTextColor(100, 116, 139);
          doc.text("Nenhum palete alocado para este item.", 20, currentY);
          currentY += 8;
        } else {
          it.pallets.forEach(pal => {
            doc.setFontSize(9);
            doc.setFont("helvetica", "normal");
            doc.setTextColor(15, 23, 42);
            const extraStr = pal.extra ? `(${pal.extra})` : '';
            doc.text(`• Palete: ${pal.quantity} vol. | Posição: ${pal.shelf} | Local: ${pal.location} ${extraStr}`, 20, currentY);
            currentY += 6;
          });
          currentY += 2;
        }
      });

      const safeClient = (ord.client || "pedido").replace(/[^a-zA-Z0-9]/g, "_");
      doc.save(`Pedido_${safeClient}.pdf`);
    });

    renderOrders();
  </script>
</body>
</html>
